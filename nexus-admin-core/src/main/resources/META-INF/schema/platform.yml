pluginId: platform
properties:
  coreVersion:
    type: string
    title: 核心版本
    description: 平台核心版本号，只读展示
    default: "1.0.0"
  maxConcurrentPlugins:
    type: integer
    title: 最大并发插件数
    description: 平台允许同时运行的插件数量上限
    default: 50
    minimum: 1
    maximum: 500
  logLevel:
    type: enum
    title: 日志级别
    description: 平台全局日志级别
    enum: [DEBUG, INFO, WARN, ERROR]
    default: INFO
  # 管理面板认证配置
  admin.auth.bootstrap.username:
    type: string
    title: 管理员用户名
    description: 引导认证的管理员用户名
    default: "admin"
  admin.auth.bootstrap.password:
    type: string
    title: 管理员密码
    description: 引导认证的管理员密码
    default: "admin123"
