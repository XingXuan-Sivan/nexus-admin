pluginId: platform
properties:
  coreVersion:
    type: string
    title: 核心版本
    description: 平台核心版本号，只读展示
    default: "1.0.0"
  maxConcurrentPlugins:
    type: integer
    title: 最大并发插件数
    description: 平台允许同时运行的插件数量上限
    default: 50
    minimum: 1
    maximum: 500
  logLevel:
    type: enum
    title: 日志级别
    description: 平台全局日志级别
    enum: [DEBUG, INFO, WARN, ERROR]
    default: INFO
  autoStart:
    type: boolean
    title: 自动启动插件
    description: 是否在平台启动时自动启动插件
    default: true
  bootstrapUsername:
    type: string
    title: 引导认证管理员用户名
    description: 引导认证管理员用户名
    default: "admin"
  bootstrapPassword:
    type: string
    title: 引导认证管理员密码
    description: 引导认证管理员密码
    default: "admin123"
  infoName:
    type: string
    title: 平台名称
    description: 平台展示名称
    default: "Nexus Admin"
  infoVersion:
    type: string
    title: 平台版本
    description: 平台版本号，只读展示
    default: "0.1.0-SNAPSHOT"
  infoDescription:
    type: string
    title: 平台描述
    description: 平台功能描述
    default: "插件化系统拓展平台"
