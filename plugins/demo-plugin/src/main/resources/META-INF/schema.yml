pluginId: demo-plugin

properties:

  greetingMessage:
    type: string
    title: 问候语
    description: 插件启动时显示的问候语
    default: "Hello from Demo Plugin!"

  enableFeature:
    type: boolean
    title: 启用特性
    description: 是否启用演示特性
    default: true

  maxItems:
    type: integer
    title: 最大项目数
    description: 允许的最大项目数量
    default: 100
    minimum: 1
    maximum: 1000

  logLevel:
    type: string
    title: 日志级别
    description: 插件日志输出级别
    default: INFO
    enum:
      - DEBUG
      - INFO
      - WARN
      - ERROR
