spring:
  application:
    name: nexus-admin
  profiles:
    active: dev

server:
  port: 8082

# 插件系统配置（仅包含启动后不可变的基础设施配置）
# 运行时可变的配置（如 autoStart、coreVersion 等）由配置中心管理
plugin:
  # 插件根目录
  path: plugins
  # 插件数据目录
  data-path: plugins-data

logging:
  level:
    root: INFO

# API 文档配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
  cache:
    # 禁用 API 文档缓存
    disabled: true

knife4j:
  enable: true
  setting:
    language: zh_cn

# 管理面板 Web 层配置
panel:
  auth:
    # 引导认证不提供代码默认密码；通过环境变量或受控部署配置注入
    bootstrap-password: ${PANEL_BOOTSTRAP_PASSWORD:}
  web:
    # 管理面板 API 基础路径（不含版本号），过滤器/拦截器基于此值决定拦截范围
    base-path: /admin
    # 公开端点路径列表（无需认证即可访问），支持 Ant 风格路径模式
    public-endpoints:
      - /admin/v1/auth/login
      - /doc.html
      - /webjars/**
      - /v3/api-docs/**
