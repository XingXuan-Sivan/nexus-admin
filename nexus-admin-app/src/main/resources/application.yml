spring:
  application:
    name: nexus-admin
  profiles:
    active: dev

server:
  port: 8082

# 平台级配置
platform:
  # 平台基本信息
  info:
    name: Nexus Admin
    version: 0.1.0-SNAPSHOT
    description: 插件化系统拓展平台
  # 插件系统配置
  plugin:
    # 插件根目录路径
    path: plugins
    # 核心版本号
    core-version: 1.0.0
    # 运行模式：DEVELOPMENT、DEPLOYMENT
    runtime-mode: DEVELOPMENT
    # 是否在加载后自动启动具有入口点的插件
    auto-start: true
  # 认证配置
  auth:
    # 引导认证配置（系统固有配置，当存在其他认证提供者时自动禁用）
    bootstrap:
      username: admin
      password: admin123

logging:
  level:
    root: INFO
