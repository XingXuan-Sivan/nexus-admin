spring:
  application:
    name: nexus-admin
  profiles:
    active: dev

server:
  port: 8082

# 插件系统配置（仅包含启动后不可变的基础设施配置）
# 运行时可变的配置（如 autoStart、coreVersion 等）由配置中心管理
plugin:
  # 插件根目录
  path: plugins
  # 插件数据目录
  data-path: plugins-data

logging:
  level:
    root: INFO

# API 文档配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false  # 使用 Knife4j UI 替代

knife4j:
  enable: true
  setting:
    language: zh_cn
